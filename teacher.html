<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Профиль учителя</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .profile {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .photo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            margin-bottom: 5px;
        }

        .position {
            color: #555;
            font-size: 18px;
        }

        .info {
            text-align: left;
            margin-top: 25px;
            line-height: 1.8;
        }

        .schedule {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .schedule th,
        .schedule td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        .schedule th {
            background: #eee;
        }
    </style>
</head>

<body>

<div class="profile">

    <img
        class="photo"
        src="https://via.placeholder.com/180"
        alt="Фото учителя"
    >

    <h1>Абдуллох Рахмонов</h1>

    <div class="position">
        Учитель английского языка
    </div>

    <div class="info">

        <p><b>Предмет:</b> Английский язык</p>

        <p><b>Должность:</b> Учитель английского языка</p>

        <p><b>Кабинет:</b> №12</p>

        <p><b>Стаж:</b> 1 год</p>

        <p><b>Образование:</b> Высшее педагогическое</p>

    </div>

    <h2>Расписание</h2>

    <table class="schedule">

        <tr>
            <th>День</th>
            <th>Время</th>
            <th>Класс</th>
            <th>Предмет</th>
        </tr>

        <tr>
            <td>Понедельник</td>
            <td>08:00</td>
            <td>6-А</td>
            <td>Английский</td>
        </tr>

        <tr>
            <td>Вторник</td>
            <td>09:00</td>
            <td>7-А</td>
            <td>Английский</td>
        </tr>

        <tr>
            <td>Среда</td>
            <td>10:00</td>
            <td>8-А</td>
            <td>Английский</td>
        </tr>

    </table>

</div>

</body>
</html>
